version: 0.36.0
date: 2026-11-03
locales:
  en:
    summary: "`foundation-adoption-review` extends the existing `foundation-engineering-check` with a new mechanical scope: \"selected peer adapters in common closure.\" It makes real calls to the new root-level API, saves full original outputs for the original reader. Mechanical results are not manually filled via `proof-create`; original outputs are stored separately per scope and not merged into a unified audit PASS. It does not assess Audit/SOURCE final state, source authority, independent resources, or platform metadata, nor does it execute targets or generators, nor does it validate release, host installation, or loading workflows."
    changes:
      changed:
        - "`foundation-adoption-review` extends the existing `foundation-engineering-check` with a new mechanical scope: \"selected peer adapters in common closure.\" It makes real calls to the new root-level API, saves full original outputs for the original reader. Mechanical results are not manually filled via `proof-create`; original outputs are stored separately per scope and not merged into a unified audit PASS. It does not assess Audit/SOURCE final state, source authority, independent resources, or platform metadata, nor does it execute targets or generators, nor does it validate release, host installation, or loading workflows."
    upgradeNotes: "Adopt all four units at 0.36.0; existing callers need no forced migration. Source candidates, local testing, or static exits cannot validate formal channels, installation, loading, or business readiness. The formal 0.35.0 package does not contain the new API."
  zh-CN:
    summary: "`foundation-adoption-review`在原有`foundation-engineering-check`基础上新增“已选同级适配器共同闭包”机械范围，真实调用新包根API，保存完整原件交由原读取器处理。不以`proof-create`手填机械结果，各范围原件独立存储，不合成完整审计PASS。不判断Audit/SOURCE终态、源权威、独立资源或平台元数据，不执行目标或生成器，不证明发布/宿主安装加载业务。"
    changes:
      changed:
        - "`foundation-adoption-review`在原有`foundation-engineering-check`基础上新增“已选同级适配器共同闭包”机械范围，真实调用新包根API，保存完整原件交由原读取器处理。不以`proof-create`手填机械结果，各范围原件独立存储，不合成完整审计PASS。不判断Audit/SOURCE终态、源权威、独立资源或平台元数据，不执行目标或生成器，不证明发布/宿主安装加载业务。"
    upgradeNotes: "四单元需锁步采用0.36.0，旧调用不强制迁移。源候选、本地测试、静态退出均不能证明正式渠道、安装加载或业务可用性。正式0.35.0不包含新入口。"
