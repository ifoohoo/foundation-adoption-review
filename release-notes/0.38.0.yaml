version: 0.38.0
date: 2026-11-06
locales:
  zh-CN:
    summary: foundation-engineering-check 新增两个显式可选范围，指定Skill文本声明对应与指定原生投影内容与资源对应，同时扩展原有固定文件引用检查，支持 raw literal 以连续 ../ 开头并接合法文件段，目标必须严格位于 root 内。新增固定Schema声明与采用链路检查能力，独立核对Markdown中完整$id与schemaVersion=N及实际普通2020-12 Schema必需版本const，可选在有限、直接、无歧义CST链路中验证Python实现中Schema加载与验证早于业务解释，JSON解码与直接版本头读取先行合法，无法分类仅实现不足并保留声明，Kit包根API无专用CLI，Plugin通过显式范围真实调用 runFixedSchemaUseCheck 及公共 readProfessionalProof。
    upgradeNotes: 四单元必须同步采用精确版本 0.38.0，各阶段（源码候选、本地自测、正式渠道、安装、加载、业务结果）需分别核收。调用方需确保选集业务一致、权威完整，适配或违规由调用方 LLM 判断。新增固定Schema检查需独立核对声明与实际Schema对应关系，可选验证实现中Schema加载与验证早于业务解释，JSON解码与直接版本头读取先行合法，无法分类仅实现不足并保留声明，Kit无专用CLI，Plugin通过真实调用 runFixedSchemaUseCheck 及公共 readProfessionalProof 完成。
    changes:
      changed:
        - foundation-engineering-check 新增两个显式可选范围，指定Skill文本声明对应与指定原生投影内容与资源对应，分别通过真实调用 runSkillSurfaceBindingCheck 或 runNativeProjectionCheck 及对应 CLI 验证，结果保留原始 professional-conclusion 并交`readProfessionalProof`。
        - 原有固定文件引用检查能力扩展支持有限前置 ../ 路径，raw literal 可以一个或多个连续 ../ 开头，后接由 / 分隔的合法文件段，目标必须严格位于 root 内，路径由 path.posix.join 处理并执行规范化。 该范围直接调用 `runStaticReferenceCheck` 包根 API，并由公共读取器解释实际返回。
        - 局部机械结果按实际 scope 使用，调用方负责选集的业务一致性、权威性与完整性，领域允许适配或违规由调用方 LLM 判断。
        - 新增固定Schema声明与采用链路检查能力，独立比较Markdown中完整$id与schemaVersion=N及实际普通2020-12 Schema必需版本const。可选在有限、直接、无歧义CST链路中核对Python实现中实际采用的Schema文件、同一数据绑定与验证早于业务解释。JSON解码与直接版本头读取先行合法，无法分类仅实现不足并保留声明。Kit包根API无专用CLI，Plugin通过显式范围真实调用 runFixedSchemaUseCheck 及公共 readProfessionalProof。
  en:
    summary: 'foundation-engineering-check adds two explicit optional scopes: "specified Skill text declaration correspondence" and "specified native projection content and resource correspondence," and extends existing fixed file reference checking to support limited leading ../ paths in raw literal, with target strictly within root. Adds fixed Schema declaration and usage chain check capability, independently verifying Markdown declaration against the actual Schema identity and required fixed version, optionally validating that Schema loading and validation in Python implementation occur before business interpretation, with JSON decoding and direct version header reading considered valid precedence; unclassifiable cases result in insufficient implementation only while preserving declaration; Kit has no dedicated CLI; Plugin invokes the API and public reader via explicit scope selection.'
    upgradeNotes: "All four units must adopt the exact 0.38.0 release version in sync, with verification required at each stage: source candidate, local testing, official channel, installation, loading, and business outcome. The caller is responsible for ensuring business consistency, authority, and completeness of the selected set; adaptation or violation judgment is the caller’s responsibility. The new fixed Schema check requires independent verification of declaration-to-Schema correspondence, optional validation of Schema loading and validation preceding business interpretation in implementation, with JSON decoding and direct version header reading considered valid precedence; unclassifiable cases result in insufficient implementation only while preserving declaration; Kit has no dedicated CLI; Plugin invokes the API and public reader via real call with explicit scope selection."
    changes:
      changed:
        - 'foundation-engineering-check adds two explicit optional scopes: "specified Skill text declaration correspondence" and "specified native projection content and resource correspondence," verified via real calls to runSkillSurfaceBindingCheck or runNativeProjectionCheck and corresponding CLI, with original professional-conclusion preserved and passed to the original proof reader.'
        - "The existing fixed file reference check is extended to support limited leading ../ paths: raw literal may begin with one or more consecutive ../ followed by valid file segments separated by /, with the target strictly within root; path.posix.join is always applied regardless of baseDir value. This scope calls the existing `runStaticReferenceCheck` package-root API and reads the actual return through the public proof reader."
        - Local mechanical results are used based on actual scope. The caller ensures business consistency, authority, and completeness of the selected set, and domain-level adaptation or violation judgment is the caller’s responsibility.
        - Adds fixed Schema declaration and usage chain check capability, independently comparing the full $id and schemaVersion=N in Markdown against the actual required version const of the standard 2020-12 Schema. Optionally verifies in a limited, direct, unambiguous CST chain the actual Schema file used by the Python validator, the same data binding, and validation before business interpretation. JSON decoding and direct version header reading are valid precedence. Unclassifiable cases result in insufficient implementation only while preserving the declaration. Kit has no dedicated CLI. Plugin invokes the API and public reader via explicit scope selection using the exact API name runFixedSchemaUseCheck and readProfessionalProof.
